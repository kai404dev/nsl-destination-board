<div class="program" id="program-root">
    <div class="prog-details">
        <div class="prog-bar">
            <label class="prog-pick">Program
                <select id="prog-select">
                    <option>Loading…</option>
                </select>
            </label>
            <button id="prog-save" class="btn-primary" type="button" data-action="save">Save</button>
            <button id="prog-migrate" class="btn-primary" type="button" data-action="migrate" hidden>Migrate to v2</button>
            <button id="prog-delete" class="btn-danger" type="button" data-action="delete-program">Delete</button>
            <span class="prog-version" id="prog-version"></span>
            <span class="prog-status" id="prog-status"></span>
        </div>
        <div class="new-program">
            <input type="text" id="new-program" placeholder="New program name">
            <button type="button" data-action="add-program">New program</button>
        </div>
        <div class="prog-transfer">
            <button type="button" data-action="export">Export</button>
            <button type="button" data-action="migrate-all" title="Convert every v1 program file to the v2 format">Migrate all to v2</button>
            <input type="file" id="import-file" accept=".dest,application/json">
        </div>
        <div class="prog-defaults">
            <h3>Defaults</h3>
            <label for="prog-def-colour">Colour</label>
            <input type="color" id="prog-def-colour" value="#DB7700">
            <div class="add-grid">
                <label>Rotation (s)<input type="number" id="prog-def-speed" min="0.3" step="0.5"></label>
                <label>Width (px)<input type="number" id="prog-def-width" min="1" max="1024"></label>
                <label>Height (px)<input type="number" id="prog-def-height" min="1" max="256"></label>
            </div>
            <p class="muted">Colour is the fallback for new pages; rotation is seconds per frame on the board.</p>
        </div>
    </div>
    <div class="prog-content">
        <div id="service-list"></div>
        <div class="add-service">
            <h3>Add destination</h3>
            <div class="add-grid">
                <label>Service<input type="text" id="new-service" placeholder="e.g. 1"></label>
                <label>Destination<input type="text" id="new-destination" placeholder="e.g. Burton"></label>
                <label>Code<input type="text" id="new-code" placeholder="e.g. 101"></label>
            </div>
            <button type="button" class="btn-primary" data-action="add-destination">Add destination</button>
        </div>
    </div>
</div>
