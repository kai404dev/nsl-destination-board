<div class="bdf" id="bdf-root">
    <div class="bdf-bar">
        <label class="bdf-pick">Font
            <select id="bdf-font">
                <option>Loading…</option>
            </select>
        </label>
        <label class="bdf-pick">Size
            <select id="bdf-size">
                <option>Loading…</option>
            </select>
        </label>
        <span class="bdf-status" id="bdf-status"></span>
        <button id="bdf-save" class="btn-primary" type="button">Save glyph</button>
    </div>
    <div class="bdf-subtabs" role="tablist" aria-label="Font views">
        <button type="button" data-ftab="editor" class="active">Glyph editor</button>
        <button type="button" data-ftab="overview">All sizes overview</button>
    </div>
    <div class="bdf-cols" id="bdf-editor-view">
        <div class="bdf-map" id="bdf-map"></div>
        <div class="bdf-edit">
            <h3 id="bdf-glyph-name">–</h3>
            <div class="bdf-meta" id="bdf-meta"></div>
            <canvas id="bdf-canvas"></canvas>
            <div class="bdf-tools">
                <button type="button" data-tool="left" aria-label="Shift left">←</button>
                <button type="button" data-tool="right" aria-label="Shift right">→</button>
                <button type="button" data-tool="up" aria-label="Shift up">↑</button>
                <button type="button" data-tool="down" aria-label="Shift down">↓</button>
                <button type="button" data-tool="invert">Invert</button>
                <button type="button" data-tool="clear">Clear</button>
            </div>
            <label>Test
                <input type="text" id="bdf-test" value="Tutbury 101">
            </label>
            <canvas id="bdf-strip" width="240" height="40"></canvas>
        </div>
    </div>
    <div id="bdf-overview-view" hidden>
        <div class="bdf-overview-bar">
            <label>Preview text
                <input type="text" id="bdf-overview-text"
                    value="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"
                    title="Long strings are split into A–Z / a–z / 0–9 rows">
            </label>
            <label class="bdf-overview-scale">Zoom
                <select id="bdf-overview-scale">
                    <option value="1">1×</option>
                    <option value="2" selected>2×</option>
                    <option value="3">3×</option>
                    <option value="4">4×</option>
                </select>
            </label>
            <button id="bdf-overview-reload" type="button">Reload</button>
            <span class="bdf-status" id="bdf-overview-status"></span>
        </div>
        <div id="bdf-overview-grid"></div>
    </div>
</div>
